<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Etapa 08 — PUT
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <a href="../index.html" class="btn btn-outline-secondary mb-4"> ← Voltar </a>
      <div class="card shadow-sm mx-auto" style="max-width: 800px">
        <div class="card-body p-4">
          <span class="badge text-bg-info"> Etapa 08 </span>
          <h1 class="h2 mt-3">
            Atualizar dados com PUT
          </h1>
          <form id="formulario">
            <div class="mb-3">
              <label for="id" class="form-label">
                ID do post
              </label>
              <input id="id" class="form-control" type="number" min="1" value="1" />
            </div>
            <div class="mb-3">
              <label for="titulo" class="form-label">
                Novo título
              </label>
              <input id="titulo" class="form-control" value="Título atualizado" />
            </div>
            <div class="mb-3">
              <label for="conteudo" class="form-label">
                Novo conteúdo
              </label>
              <textarea id="conteudo" class="form-control" rows="4">
                Conteúdo atualizado com PUT.
              </textarea>
            </div>
            <button class="btn btn-info" type="submit">
              Atualizar
            </button>
          </form>
          <div id="status" class="alert d-none mt-3" role="status">
          </div>
          <pre id="saida" class="bg-dark text-white rounded p-3 mt-3">
            Envie o formulário para ver o retorno.
          </pre>
        </div>
      </div>
    </main>
    <script src="script.js">
    </script>
  </body>
</html>
