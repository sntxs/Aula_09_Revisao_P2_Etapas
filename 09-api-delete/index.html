<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Etapa 09 — DELETE
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <a href="../index.html" class="btn btn-outline-secondary mb-4"> ← Voltar </a>
      <div class="card shadow-sm mx-auto" style="max-width: 700px">
        <div class="card-body p-4">
          <span class="badge text-bg-danger"> Etapa 09 </span>
          <h1 class="h2 mt-3">
            Excluir dados com DELETE
          </h1>
          <div class="alert alert-warning">
            A confirmação abaixo é uma prática de interface. Em uma API real, a autorização precisa existir no servidor.
          </div>
          <form id="formulario">
            <label for="id" class="form-label">
              ID do post
            </label>
            <input id="id" class="form-control mb-3" type="number" min="1" value="1" />
            <button class="btn btn-danger" type="submit">
              Excluir
            </button>
          </form>
          <div id="status" class="alert d-none mt-3" role="status">
          </div>
          <pre id="saida" class="bg-dark text-white rounded p-3 mt-3">
            Envie o formulário para ver o retorno.
          </pre>
        </div>
      </div>
    </main>
    <script src="script.js">
    </script>
  </body>
</html>
