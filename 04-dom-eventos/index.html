<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Revisão — DOM e eventos
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <a href="../index.html" class="btn btn-outline-secondary mb-4"> ← Voltar </a>
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1>
            DOM e eventos
          </h1>
          <div class="alert alert-info">
            <strong> Exemplo rápido: </strong> <code> querySelector("#botao") </code> encontra o botão e <code> addEventListener("click", ...) </code> reage ao clique.
          </div>
          <label for="nome" class="form-label">
            Digite seu nome
          </label>
          <input id="nome" class="form-control mb-3" type="text" />
          <button id="botao" class="btn btn-success">
            Atualizar mensagem
          </button>
          <p id="mensagem" class="alert alert-secondary mt-3">
            Aguardando interação.
          </p>
        </div>
      </div>
    </main>
    <script src="script.js">
    </script>
  </body>
</html>
