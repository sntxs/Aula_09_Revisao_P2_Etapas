<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Revisão — Formulário
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <a href="../index.html" class="btn btn-outline-secondary mb-4"> ← Voltar </a>
      <div class="card shadow-sm mx-auto" style="max-width: 650px">
        <div class="card-body p-4">
          <h1>
            Formulário validado
          </h1>
          <div class="alert alert-info">
            <strong> Exemplo rápido: </strong> <code> preventDefault() </code> impede o comportamento automático do formulário para que o JavaScript controle a validação.
          </div>
          <div id="status" class="alert d-none" role="status">
          </div>
          <form id="formulario" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">
                E-mail
              </label>
              <input id="email" class="form-control" type="email" required />
              <div class="invalid-feedback">
                Informe um e-mail válido.
              </div>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">
                Senha de estudo
              </label>
              <input id="senha" class="form-control" type="password" minlength="4" required />
              <div class="invalid-feedback">
                Informe pelo menos 4 caracteres.
              </div>
            </div>
            <button class="btn btn-success" type="submit">
              Validar
            </button>
          </form>
        </div>
      </div>
    </main>
    <script src="script.js">
    </script>
  </body>
</html>
